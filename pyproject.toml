[project]
name = "neuro"
version = "0.1.0"
description = "NeuroAvalia backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<5.3",
    "django-cors-headers>=4.7.0",
    "django-ninja>=1.3.0",
    "django-tailwind>=3.8.0",
    "dj-database-url>=2.2.0",
    "gunicorn>=23.0.0",
    "psycopg[binary]>=3.2.3",
    "pydantic[email]>=2.10.0",
    "python-dateutil>=2.9.0.post0",
    "whitenoise>=6.8.2",
    "resend>=2.27.0",
    "requests>=2.33.1",
    "python-dotenv>=1.2.2",
    "matplotlib>=3.10.8",
    "pillow>=12.2.0",
    "python-docx>=1.2.0",
    "reportlab>=4.4.1",
    "redis>=5.0.0",
    "pandas>=3.0.2",
    "graphifyy>=0.5.0",
    "weasyprint>=68.1",
    "playwright>=1.60.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.14",
]
