<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Logo Neuroavalia</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f7f9;
      font-family: Arial, Helvetica, sans-serif;
    }

    .preview {
      background: #ffffff;
      padding: 56px 72px;
      border-radius: 28px;
      box-shadow: 0 18px 45px rgba(18, 58, 90, 0.12);
    }

    svg {
      width: 760px;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="preview">
    <svg viewBox="0 0 760 210" xmlns="http://www.w3.org/2000/svg">

      <!-- Símbolo radial -->
      <g transform="translate(100 105)">
        <!-- Conexões principais -->
        <line x1="0" y1="0" x2="-46" y2="-48" stroke="#9EB4C2" stroke-width="1.8" />
        <line x1="0" y1="0" x2="18" y2="-62" stroke="#9EB4C2" stroke-width="1.8" />
        <line x1="0" y1="0" x2="58" y2="-42" stroke="#9EB4C2" stroke-width="1.8" />
        <line x1="0" y1="0" x2="68" y2="4" stroke="#9EB4C2" stroke-width="1.8" />
        <line x1="0" y1="0" x2="34" y2="56" stroke="#9EB4C2" stroke-width="1.8" />
        <line x1="0" y1="0" x2="-32" y2="54" stroke="#9EB4C2" stroke-width="1.8" />
        <line x1="0" y1="0" x2="-66" y2="12" stroke="#9EB4C2" stroke-width="1.8" />

        <!-- Conexões externas discretas -->
        <path d="M-46 -48 L18 -62 L58 -42 L68 4 L34 56 L-32 54 L-66 12 Z"
              fill="none"
              stroke="#D6E2E8"
              stroke-width="1.6"
              stroke-linejoin="round" />

        <path d="M-46 -48 C-20 -72, 25 -84, 58 -42"
              fill="none"
              stroke="#D6E2E8"
              stroke-width="1.4"
              stroke-linecap="round" />

        <path d="M-66 12 C-42 38, -5 70, 34 56"
              fill="none"
              stroke="#D6E2E8"
              stroke-width="1.4"
              stroke-linecap="round" />

        <!-- Ponto central -->
        <circle cx="0" cy="0" r="8.5" fill="#123A5A" />

        <!-- Pontos externos -->
        <circle cx="-46" cy="-48" r="7" fill="#CBD6DE" />
        <circle cx="18" cy="-62" r="7" fill="#27BBD0" />
        <circle cx="58" cy="-42" r="7" fill="#CBD6DE" />
        <circle cx="68" cy="4" r="7" fill="#123A5A" />
        <circle cx="34" cy="56" r="7" fill="#CBD6DE" />
        <circle cx="-32" cy="54" r="7" fill="#27BBD0" />
        <circle cx="-66" cy="12" r="7" fill="#CBD6DE" />

        <!-- Pontos menores de apoio -->
        <circle cx="1" cy="-35" r="4" fill="#D6E2E8" />
        <circle cx="38" cy="-7" r="4" fill="#D6E2E8" />
        <circle cx="8" cy="36" r="4" fill="#D6E2E8" />
        <circle cx="-36" cy="-8" r="4" fill="#D6E2E8" />
      </g>

      <!-- Texto -->
      <text x="220" y="112"
            font-family="Arial, Helvetica, sans-serif"
            font-size="62"
            font-weight="700"
            letter-spacing="-1.8">
        <tspan fill="#123A5A">Neuro</tspan><tspan fill="#1B7F8C">avalia</tspan>
      </text>

      <!-- Linha institucional discreta -->
      <text x="224" y="144"
            font-family="Arial, Helvetica, sans-serif"
            font-size="14"
            font-weight="600"
            letter-spacing="3"
            fill="#7E929F">
        AVALIAÇÃO NEUROPSICOLÓGICA
      </text>

    </svg>
  </div>
</body>
</html>
