# ============================================================
# NeuroAvalia — DigitalOcean (Droplet + Managed PostgreSQL)
# Uso: docker compose --env-file .env.digitalocean -f docker-compose.digitalocean.yml up -d --build
# ============================================================

services:
  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      target: prod
    container_name: neuro-backend-do
    entrypoint: ["sh", "/app/infra/docker/backend.entrypoint.sh"]
    command: uv run gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --log-file -
    restart: always
    expose:
      - "8000"
    volumes:
      - neuro_static_data:/app/staticfiles
      - neuro_media_data:/app/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ${APP_ENV_FILE:-.env.digitalocean}
    environment:
      - DEBUG=False
      - DJANGO_ENV=production

  frontend:
    build:
      context: ./neuro-frontend
      dockerfile: Dockerfile
      target: prod
      args:
        INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://backend:8000}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    container_name: neuro-frontend-do
    restart: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - INTERNAL_API_BASE_URL=${INTERNAL_API_BASE_URL:-http://backend:8000}
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-}
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    container_name: neuro-caddy-do
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - APP_DOMAIN=${APP_DOMAIN}
      - ACME_EMAIL=${ACME_EMAIL}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - neuro_static_data:/var/www/django/static:ro
      - neuro_media_data:/var/www/django/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  neuro_static_data:
  neuro_media_data:
  caddy_data:
  caddy_config:
