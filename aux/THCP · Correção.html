<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THCP · Correção</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
</style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen">

<header class="sticky top-0 z-10 bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow">
  <div class="max-w-[1500px] mx-auto px-4 py-3 flex flex-wrap items-center gap-x-6 gap-y-2">
    <div>
      <p class="text-[10px] uppercase tracking-widest text-indigo-100">Protocolo de Registro das Respostas</p>
      <h1 class="text-xl font-bold leading-tight">THCP · Correção</h1>
    </div>
    <div class="flex flex-wrap gap-2 flex-1 min-w-[260px]">
      <input placeholder="Nome da criança" class="flex-1 min-w-[140px] rounded-lg bg-white/15 placeholder-indigo-100 px-3 py-1.5 text-sm outline-none focus:bg-white/25">
      <input placeholder="Examinador" class="w-36 rounded-lg bg-white/15 placeholder-indigo-100 px-3 py-1.5 text-sm outline-none focus:bg-white/25">
      <input type="date" title="Data de aplicação" class="w-36 rounded-lg bg-white/15 px-3 py-1.5 text-sm outline-none focus:bg-white/25 [color-scheme:dark]">
    </div>
    <div class="flex items-center gap-4">
      <div class="w-36">
        <div class="h-1.5 rounded-full bg-white/25 overflow-hidden"><div id="bar" class="h-full bg-white transition-all" style="width:0%"></div></div>
        <p id="prog" class="text-[11px] text-indigo-100 mt-1"></p>
      </div>
      <div class="text-right leading-none">
        <p class="text-[10px] uppercase tracking-wide text-indigo-100">Total THCP</p>
        <p id="total" class="text-4xl font-extrabold">0</p>
      </div>
      <button id="reset" class="rounded-lg bg-white/15 hover:bg-white/25 px-3 py-1.5 text-xs">Limpar</button>
    </div>
  </div>
</header>

<main class="max-w-[1500px] mx-auto p-4 grid lg:grid-cols-3 gap-4 items-start">
  <div id="c0" class="space-y-4"></div>
  <div id="c1" class="space-y-4"></div>
  <div class="space-y-4">
    <div id="c2" class="space-y-4"></div>

    <section class="bg-white dark:bg-slate-900 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden">
      <div class="px-4 py-2 bg-rose-50 dark:bg-rose-950/40 text-rose-700 dark:text-rose-300 flex items-center justify-between">
        <h2 class="font-semibold text-sm">Atenção</h2>
        <span class="text-xs">acertos − erros = <b id="t-at" class="text-base">0</b></span>
      </div>
      <div class="p-3 grid grid-cols-2 gap-3">
        <label class="text-xs">Nº de acertos<input id="ac" type="number" min="0" class="mt-1 w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-transparent px-3 py-1.5 text-sm focus:ring-2 focus:ring-rose-500 outline-none"></label>
        <label class="text-xs">Nº de erros<input id="er" type="number" min="0" class="mt-1 w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-transparent px-3 py-1.5 text-sm focus:ring-2 focus:ring-rose-500 outline-none"></label>
      </div>
    </section>

    <section class="bg-white dark:bg-slate-900 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 p-4">
      <h2 class="font-semibold text-sm mb-2">Resumo</h2>
      <div id="sum" class="space-y-1 text-xs"></div>
      <div class="mt-3 pt-3 border-t border-slate-200 dark:border-slate-800 flex items-end justify-between">
        <span class="text-xs text-slate-500">Total THCP<br>(HPM + Ling. + Mem. + Atenção + PQ)</span>
        <b id="total2" class="text-4xl font-extrabold text-indigo-600 dark:text-indigo-400 leading-none">0</b>
      </div>
    </section>
  </div>
</main>

<script>
const r=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const cp=l=>[l,r(0,2)];
const D={
 hpm1:{t:'HPM · Exercício I',c:'indigo',g:[[0,'Labirinto (0 a 4)'],[1,'Cópia (0 a 2 cada)']],items:[
  ['Labirinto',r(0,4)],cp('1a · Quadrado'),cp('1b · Triângulo'),cp('2a · Letra A'),cp('2b · Letra B'),cp('3a · Número 7'),cp('3b · Letra G'),cp('4 · Número 2'),
  cp('5a · Fig. complexa: quadrado'),cp('5b · Fig. complexa: círculo'),cp('5c · Fig. complexa: posição'),cp('5d · Fig. complexa: proporção')]},
 hpm2:{t:'HPM · Exercício II',c:'indigo',items:[
  ['1',r(1,5)],['2',r(1,4)],['3',r(1,5)],['4a',r(1,4)],['4b',r(1,4)],['4c',r(1,4)],['5',r(1,4)],['6',r(1,4)]]},
 ling:{t:'Linguagem',c:'emerald',items:r(1,12).map(n=>[String(n),r(1,4)])},
 mem:{t:'Memória',c:'sky',items:[
  ['1',r(1,3)],['2',r(1,3)],['3* (2 cartas = 2 pts)',r(0,3)],['4* (4 cartas = 4 pts)',[0,1,2,3,5]]]},
 pq:{t:'Pensamento Quantitativo (PQ)',c:'amber',items:[
  ['1',r(1,4)],['2a',r(1,4)],['2b',r(1,5)],['3',r(1,5)],['4',r(1,4)],['5',r(1,4)],['6',r(1,4)],['7',r(1,4)],['8',r(1,7)],['9',r(1,6)],['10',r(1,4)]]}
};
const COLS=[['hpm1','hpm2'],['ling','mem'],['pq']];
const C={indigo:'bg-indigo-600',emerald:'bg-emerald-600',amber:'bg-amber-500',sky:'bg-sky-600'};
const H={indigo:'bg-indigo-50 dark:bg-indigo-950/40 text-indigo-700 dark:text-indigo-300',emerald:'bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300',amber:'bg-amber-50 dark:bg-amber-950/40 text-amber-700 dark:text-amber-300',sky:'bg-sky-50 dark:bg-sky-950/40 text-sky-700 dark:text-sky-300'};
const names={hpm1:'HPM · Ex. I',hpm2:'HPM · Ex. II',ling:'Linguagem',mem:'Memória',pq:'Pens. Quantitativo'};
let S={};
const sum=k=>D[k].items.reduce((a,_,i)=>a+(S[k+i]??0),0);
const done=k=>D[k].items.filter((_,i)=>S[k+i]!==undefined).length;
const att=()=>(+document.getElementById('ac').value||0)-(+document.getElementById('er').value||0);
const $=id=>document.getElementById(id);

function sec(k){
 const d=D[k];
 return `<section class="bg-white dark:bg-slate-900 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden">
  <div class="px-4 py-2 flex items-center justify-between ${H[d.c]}">
   <h2 class="font-semibold text-sm">${d.t}</h2>
   <span class="text-xs"><span class="opacity-70">${done(k)}/${d.items.length}</span> · <b class="text-base">${sum(k)}</b> pts</span>
  </div>
  <ul class="divide-y divide-slate-100 dark:divide-slate-800">
  ${d.items.map((it,i)=>`<li class="px-4 py-1.5 flex items-center justify-between gap-2">
    <span class="text-xs sm:text-[13px] font-medium">${it[0]}</span>
    <div class="flex gap-1 shrink-0">${it[1].map(v=>`<button data-k="${k}" data-i="${i}" data-v="${v}" class="h-7 min-w-7 px-1.5 rounded-md text-xs font-semibold border transition ${S[k+i]===v?C[d.c]+' text-white border-transparent shadow':'border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800'}">${v}</button>`).join('')}</div>
  </li>`).join('')}
  </ul></section>`;
}
function render(){
 COLS.forEach((ks,i)=>$('c'+i).innerHTML=ks.map(sec).join(''));
 totals();
}
function totals(){
 const ks=Object.keys(D),a=att(),tot=ks.reduce((s,k)=>s+sum(k),0)+a;
 $('t-at').textContent=a;$('total').textContent=tot;$('total2').textContent=tot;
 $('sum').innerHTML=ks.map(k=>`<div class="flex justify-between"><span class="text-slate-500">${names[k]}</span><b>${sum(k)}</b></div>`).join('')+`<div class="flex justify-between"><span class="text-slate-500">Atenção</span><b>${a}</b></div>`;
 const n=ks.reduce((s,k)=>s+done(k),0),T=ks.reduce((s,k)=>s+D[k].items.length,0);
 $('bar').style.width=(n/T*100)+'%';$('prog').textContent=`${n} de ${T} itens`;
}
document.querySelector('main').addEventListener('click',e=>{
 const b=e.target.closest('button[data-k]');if(!b)return;
 const key=b.dataset.k+b.dataset.i,v=+b.dataset.v;
 S[key]=S[key]===v?undefined:v;
 const y=window.scrollY;render();window.scrollTo(0,y);
});
['ac','er'].forEach(id=>$(id).addEventListener('input',totals));
$('reset').onclick=()=>{S={};['ac','er'].forEach(id=>$(id).value='');render();};
render();
</script>
</body>
</html>
